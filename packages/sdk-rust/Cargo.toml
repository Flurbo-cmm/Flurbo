[package]
name = "flurbo-sdk"
version = "0.2.0-beta.0"
edition = "2021"
description = "Flurbo agent SDK and runtime for Rust: protocol-conformant claims, policies, signing, journaled execution and recovery. Monad testnet only; not published."
publish = false
license = "UNLICENSED"

# Its own workspace, separate from the repository root workspace.
[workspace]

[dependencies]
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha3 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[[bin]]
name = "flurbo-agent-rs"
path = "src/main.rs"
