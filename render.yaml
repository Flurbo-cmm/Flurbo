services:
  - type: web
    name: flurbopm-testnet
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: FLURBO_ORIGIN
        value: https://flurbopm.singu.online
      - key: FLURBO_NETWORK
        value: public_testnet
      - key: FLURBO_SCHEDULER
        value: "false"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
